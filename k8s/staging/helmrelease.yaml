apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: base-chart
  namespace: identidade-carioca-authz
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/prefeitura-rio/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: identidade-carioca-authz
  namespace: identidade-carioca-authz
spec:
  interval: 10m
  chart:
    spec:
      chart: base-chart
      version: 2.4.2
      sourceRef:
        kind: HelmRepository
        name: base-chart
      interval: 1h
  values:
    replicaCount: 25
    fullnameOverride: identidade-carioca-authz
    image:
      repository: ghcr.io/prefeitura-rio/identidade-carioca-authz
      tag: sha-a8fbe7c50f0a0d3130f51054fd16f231c09296f2@sha256:f315f7844d331ea192cefd0181a876cdc44c0478e0fcf5e6ea49c81f7a4136f9
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr-credentials
    service:
      type: ClusterIP
      port: 8000
      containerPort: 8000
      ports:
        - name: grpc
          port: 9000
          targetPort: 9000
          protocol: TCP
    resources:
      requests: { memory: 256Mi, cpu: 250m }
      limits: { memory: 512Mi, cpu: 2000m }
    healthCheck: { path: /health }
    podSecurityContext: { fsGroup: 1001 }
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      readOnlyRootFilesystem: true
    terminationGracePeriodSeconds: 30
    envFrom:
      - secretRef: { name: cerbos-authz-secrets }
    env:
      - name: REDIS_MAPPINGS_SENTINEL_HOSTS
        value: redis-announce-0.cerbos-redis.svc.cluster.local:26379,redis-announce-1.cerbos-redis.svc.cluster.local:26379
      - name: REDIS_MAPPINGS_SENTINEL_SERVICE_NAME
        value: mymaster
    infisicalSecret:
      enabled: true
      secretName: cerbos-authz-secrets
      projectSlug: identidade-carioca-authz-ql-vg
      envSlug: staging
      creationPolicy: Orphan
      universalAuth:
        credentialsRef:
          secretName: universal-auth-credentials
          secretNamespace: infisical-operator-system
    istio:
      enabled: false
    autoscaling:
      enabled: true
      minReplicas: 25
      maxReplicas: 25
      keda: { enabled: false }
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
